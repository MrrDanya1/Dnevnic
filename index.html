<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник 9Б</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.app{max-width:600px;margin:auto;min-height:100vh;padding:18px 14px 100px}
header{margin-bottom:20px}.logo{font-size:27px;font-weight:800}.class-name{color:#777;font-size:14px;margin-top:3px}
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:3px}
.tab{flex:1 0 19%;min-width:72px;background:#111;border:1px solid #222;color:#888;border-radius:12px;padding:9px 6px;font-size:12px}
.tab b{display:block;color:inherit;font-size:14px;margin-bottom:3px}.tab.active{background:#fff;color:#000;border-color:#fff}
.schedule{background:#111;border:1px solid #222;border-radius:17px;padding:15px;margin-bottom:18px}
.schedule-title{font-size:18px;font-weight:700;margin-bottom:12px}
.lesson{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #1d1d1d}
.lesson:last-child{border-bottom:0;padding-bottom:0}.num{width:24px;color:#666;font-size:13px;text-align:center;flex:none}.lesson-info{flex:1}.lesson-name{font-size:14px;line-height:1.3}.lesson-hw{color:#aaa;font-size:13px;line-height:1.4;margin-top:5px}.lesson-hw.done{color:#666;text-decoration:line-through}
.section-title{font-size:18px;font-weight:700;margin:20px 0 12px}
.homework{background:#111;border:1px solid #222;border-radius:17px;padding:15px;margin-bottom:11px}
.subject{font-size:16px;font-weight:700;margin-bottom:8px}.task{color:#cfcfcf;line-height:1.45;white-space:pre-wrap}
.done{opacity:.45}.done .subject{text-decoration:line-through}
.actions{display:flex;gap:8px;margin-top:13px}button{border:0;color:#fff;background:#1c1c1c;border-radius:11px;padding:10px 13px;font-size:13px}
.done-btn{background:#202020}.delete-btn{background:#171717;color:#aaa}
.empty{text-align:center;color:#555;padding:45px 10px}
.add-button{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;background:#fff;color:#000;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px #000}
.modal-bg{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal{width:100%;max-width:600px;background:#101010;border-radius:24px 24px 0 0;padding:20px 15px 30px;border-top:1px solid #292929}
.modal h2{margin:0 0 18px;font-size:21px}.field{margin-bottom:12px}.field label{display:block;color:#888;font-size:12px;margin-bottom:6px}
input,select,textarea{width:100%;background:#181818;color:#fff;border:1px solid #292929;border-radius:12px;padding:13px;font-size:15px;outline:0}
textarea{resize:vertical;min-height:90px}.save,.cancel{width:100%;margin-top:5px;padding:14px;font-weight:700}
.save{background:#fff;color:#000}.cancel{background:#1a1a1a;color:#aaa;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">Дневник</div><div class="class-name">9Б класс</div></header>
<div class="tabs" id="dayTabs"></div>
<div class="schedule"><div class="schedule-title" id="scheduleTitle">Расписание</div><div id="scheduleList"></div></div>
</div>

<button class="add-button" onclick="openModal()">+</button>
<div class="modal-bg" id="modalBg"><div class="modal">
<h2>Добавить домашку</h2>
<div class="field"><label>Урок</label><select id="subject"></select></div>
<div class="field"><label>Задание</label><textarea id="task" placeholder="Например: §15, выучить правила..."></textarea></div>
<button class="save" onclick="addHomework()">Добавить</button>
<button class="cancel" onclick="closeModal()">Отмена</button>
</div></div>

<script>
const schedule={
"Понедельник":["Разговор о важном","Русский язык","Русский язык","Физика","Биология","Вероятность и статистика","Английский язык"],
"Вторник":["Литература","История","Английский язык","Алгебра","Химия","Геометрия","Курсы «Интересные вопросы математики» (факультатив ОГЭ)"],
"Среда":["Русский язык","Физическая культура","Литература","ОБЖ","Алгебра","География","Обществознание"],
"Четверг":["Физическая культура","Биология","Технология","Геометрия","Химия","Физика"],
"Пятница":["География","Физика","История","Алгебра","Литература","Информатика / Английский язык","Информатика / Английский язык"]
};
const days=["Понедельник","Вторник","Среда","Четверг","Пятница"];
const shortDays=["Пн","Вт","Ср","Чт","Пт"];
function moscowParts(){
 const p=new Intl.DateTimeFormat("en-US",{timeZone:"Europe/Moscow",year:"numeric",month:"numeric",day:"numeric",weekday:"long"}).formatToParts(new Date());
 const get=t=>Number(p.find(x=>x.type===t).value);
 return {year:get("year"),month:get("month"),day:get("day"),weekday:p.find(x=>x.type==="weekday").value};
}
function moscowWeekday(){
 const map={Monday:"Понедельник",Tuesday:"Вторник",Wednesday:"Среда",Thursday:"Четверг",Friday:"Пятница"};
 return map[moscowParts().weekday]||"Понедельник";
}
let selectedDay=moscowWeekday();
let homework=[];
try{const saved=JSON.parse(localStorage.getItem("dnevnic_homework")||"[]");homework=Array.isArray(saved)?saved:[]}catch(e){homework=[];}
homework=homework.map(x=>{
 if(!x.day&&x.date){const d=new Date(x.date+"T12:00:00"),n=d.getDay();x.day=n>=1&&n<=5?days[n-1]:"Понедельник";delete x.date;}
 return x;
});
function save(){localStorage.setItem("dnevnic_homework",JSON.stringify(homework));}
function weekDates(){
 const t=moscowParts(),now=new Date(t.year,t.month-1,t.day),day=now.getDay(),diff=day===0?-6:1-day,monday=new Date(now);
 monday.setDate(now.getDate()+diff);
 return days.map((_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
}
function dateText(d){return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");}
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");}
function renderTabs(){
 const dates=weekDates();
 document.getElementById("dayTabs").innerHTML=days.map((d,i)=>'<button class="tab '+(d===selectedDay?"active":"")+'" data-day="'+esc(d)+'" onclick="selectDay(this.dataset.day)"><b>'+shortDays[i]+'</b><span>'+dateText(d)+'</span></button>').join("");
}
function renderSchedule(){
 const lessons=schedule[selectedDay]||[];
 document.getElementById("scheduleTitle").textContent=selectedDay;
 document.getElementById("scheduleList").innerHTML=lessons.map((subject,i)=>{
  const hws=homework.filter(x=>x.day===selectedDay&&x.subject===subject);
  const hw=hws.map(x=>'<div class="lesson-hw '+(x.done?"done":"")+'">ДЗ: '+esc(x.task)+'</div>').join("");
  return '<div class="lesson"><div class="num">'+(i+1)+'</div><div class="lesson-info"><div class="lesson-name">'+esc(subject)+'</div>'+hw+'</div></div>';
 }).join("");
}
function selectDay(day){if(!schedule[day])return;selectedDay=day;renderTabs();renderSchedule();}
function openModal(){
 const select=document.getElementById("subject");
 select.innerHTML=(schedule[selectedDay]||[]).map(x=>'<option>'+esc(x)+'</option>').join("");
 document.getElementById("task").value="";
 document.getElementById("modalBg").style.display="flex";
}
function closeModal(){document.getElementById("modalBg").style.display="none";}
function addHomework(){
 const subject=document.getElementById("subject").value,task=document.getElementById("task").value.trim();
 if(!task){alert("Напиши задание");return;}
 homework.push({id:Date.now(),day:selectedDay,subject,task,done:false});
 save();closeModal();renderSchedule();
}
function toggleDone(id){
 const x=homework.find(x=>Number(x.id)===Number(id));
 if(x){x.done=!x.done;save();renderSchedule();}
}
function deleteHomework(id){
 homework=homework.filter(x=>Number(x.id)!==Number(id));
 save();renderSchedule();
}
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal();});
renderTabs();renderSchedule();save();
</script>
</body>
</html>
