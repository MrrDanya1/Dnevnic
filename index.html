<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дневник 9Б</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
.app{max-width:600px;margin:auto;min-height:100vh;padding:18px 14px 100px}
header{margin-bottom:20px}.logo{font-size:27px;font-weight:800}.class-name{color:#777;font-size:14px;margin-top:3px}
.week-switch{display:flex;align-items:center;justify-content:space-between;background:#111;border:1px solid #222;border-radius:14px;padding:7px;margin-bottom:10px}.week-switch button{width:40px;height:36px;padding:0;font-size:20px}.week-name{text-align:center;font-size:13px;color:#aaa;flex:1}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:3px}
.tab{flex:1 0 19%;min-width:72px;background:#111;border:1px solid #222;color:#888;border-radius:12px;padding:9px 6px;font-size:12px}
.tab b{display:block;color:inherit;font-size:14px;margin-bottom:3px}.tab.active{background:#fff;color:#000;border-color:#fff}
.schedule{background:#111;border:1px solid #222;border-radius:17px;padding:15px;margin-bottom:18px}
.schedule-title{font-size:18px;font-weight:700;margin-bottom:12px}
.lesson{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #1d1d1d}
.lesson:last-child{border-bottom:0;padding-bottom:0}.num{width:24px;color:#666;font-size:13px;text-align:center;flex:none}.lesson-info{flex:1}.lesson-name{font-size:14px;line-height:1.3}.lesson-hw{color:#aaa;font-size:13px;line-height:1.4;margin-top:5px}.lesson-hw.done{color:#666;text-decoration:line-through}
.section-title{font-size:18px;font-weight:700;margin:20px 0 12px}
.homework{background:#111;border:1px solid #222;border-radius:17px;padding:15px;margin-bottom:11px}
.subject{font-size:16px;font-weight:700;margin-bottom:8px}.task{color:#cfcfcf;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}.task a{color:inherit;text-decoration:underline;overflow-wrap:anywhere;word-break:break-all}
.done{opacity:.45}.done .subject{text-decoration:line-through}
.actions{display:flex;gap:8px;margin-top:13px}button{border:0;color:#fff;background:#1c1c1c;border-radius:11px;padding:10px 13px;font-size:13px}
.done-btn{background:#202020}.empty{text-align:center;color:#555;padding:45px 10px}
.hidden{display:none!important}.menu-button{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;background:#fff;color:#000;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 30px #000;z-index:20}.menu-bg{position:fixed;inset:0;background:#0009;display:none;z-index:15}.side-menu{position:absolute;right:12px;bottom:88px;width:min(310px,calc(100% - 24px));background:#111;border:1px solid #292929;border-radius:18px;padding:10px;box-shadow:0 12px 40px #000}.menu-title{font-weight:700;font-size:18px;padding:10px 8px 12px}.menu-item{width:100%;text-align:left;background:#181818;border:1px solid #242424;margin:4px 0;padding:13px;border-radius:12px}.theme-row{display:flex;gap:7px}.theme-row button{flex:1}.theme-row button.active{background:#fff;color:#000}
.modal-bg{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:10}
.modal{width:100%;max-width:600px;background:#101010;border-radius:24px 24px 0 0;padding:20px 15px 30px;border-top:1px solid #292929}
.modal h2{margin:0 0 18px;font-size:21px}.field{margin-bottom:12px}.field label{display:block;color:#888;font-size:12px;margin-bottom:6px}
input,select,textarea{width:100%;background:#181818;color:#fff;border:1px solid #292929;border-radius:12px;padding:13px;font-size:15px;outline:0}
textarea{resize:vertical;min-height:90px}.save,.cancel{width:100%;margin-top:5px;padding:14px;font-weight:700}
.save{background:#fff;color:#000}.cancel{background:#1a1a1a;color:#aaa;margin-top:8px}
body.light{background:#f5f5f5;color:#111}body.light .class-name{color:#777}body.light .week-switch,body.light .schedule,body.light .menu-item,body.light .side-menu,body.light .modal{background:#fff;border-color:#ddd}body.light .week-name{color:#666}body.light .tab{background:#fff;border-color:#ddd;color:#777}body.light .tab.active{background:#111;color:#fff;border-color:#111}body.light .lesson{border-color:#eee}body.light .lesson-hw{color:#666}body.light button{background:#eee;color:#111}body.light .menu-button{background:#111;color:#fff}body.light input,body.light select,body.light textarea{background:#f7f7f7;color:#111;border-color:#ddd}body.light .save{background:#111;color:#fff}body.light .cancel{background:#eee;color:#666}</style>
</head>
<body>
<div class="app">
<header><div class="logo">Дневник</div><div class="class-name">9Б класс</div></header>
<div class="week-switch" id="weekSwitch"><button type="button" onclick="prevWeek()">‹</button><div class="week-name" id="weekName">Эта неделя</div><button type="button" onclick="nextWeek()">›</button></div><div class="tabs" id="dayTabs"></div>
<div class="schedule"><div class="schedule-title" id="scheduleTitle">Загрузка</div><div id="scheduleList"></div></div>
</div>

<button id="menu-button" class="menu-button" type="button" onclick="openMenu()" aria-label="Меню">☰</button><div class="menu-bg" id="menuBg"><div class="side-menu"><div class="menu-title">Меню</div><div class="menu-item">Тема<div class="theme-row"><button type="button" id="darkThemeBtn" onclick="setTheme('dark')">Тёмная</button><button type="button" id="lightThemeBtn" onclick="setTheme('light')">Светлая</button></div></div><button class="menu-item" type="button" onclick="telegram()">Перейти в Telegram-бота</button><button class="menu-item" type="button" onclick="openModal()">Предложить ДЗ</button></div></div>
<div class="modal-bg" id="modalBg"><div class="modal">
<h2>Предложить ДЗ</h2>
<div class="field"><label>Неделя</label><select id="hwWeek"><option value="0">Эта неделя</option><option value="1">Следующая неделя</option></select></div><div class="field"><label>День недели</label><select id="hwDay" onchange="updateSubjectOptions()"><option>Понедельник</option><option>Вторник</option><option>Среда</option><option>Четверг</option><option>Пятница</option></select></div><div class="field"><label>Урок</label><select id="subject"></select></div>
<div class="field"><label>Задание</label><textarea id="task" placeholder="Например: §15, выучить правила..."></textarea></div>
<button class="save" onclick="addHomework()">Отправить на проверку</button>
<button class="cancel" onclick="closeModal()">Отмена</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
var schedule={"Понедельник":["Разговор о важном","Русский язык","Русский язык","Физика","Биология","Вероятность и статистика","Английский язык"],"Вторник":["Литература","История","Английский язык","Алгебра","Химия","Геометрия","Курсы «Интересные вопросы математики» (факультатив ОГЭ)"],"Среда":["Русский язык","Физическая культура","Литература","ОБЖ","Алгебра","География","Обществознание"],"Четверг":["Физическая культура","Биология","Технология","Геометрия","Химия","Физика"],"Пятница":["География","Физика","История","Алгебра","Литература","Информатика / Английский язык","Информатика / Английский язык"]};
var days=["Понедельник","Вторник","Среда","Четверг","Пятница"],shortDays=["Пн","Вт","Ср","Чт","Пт"],selectedDay="Понедельник",homework=[],weekOffset=0,loadingDots=0,loadingTimer=null;
var SUPABASE_URL="https://urypxiruqjzbzpvmuawk.supabase.co",SUPABASE_KEY="sb_publishable_idJre_Zv8cAXQvGticrblg_pXF9eBTP",db=null,doneLocal={};
function moscow(){var d=new Date(Date.now()+10800000);return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));}
function monday(){var t=moscow(),n=t.getUTCDay(),m=new Date(t);m.setUTCDate(t.getUTCDate()-(n===0?6:n-1)+weekOffset*7);return m;}
function weekKey(){var d=monday();return d.getUTCFullYear()+"-"+("0"+(d.getUTCMonth()+1)).slice(-2)+"-"+("0"+d.getUTCDate()).slice(-2);}
function weekDates(){var m=monday(),a=[];for(var i=0;i<5;i++){var d=new Date(m);d.setUTCDate(m.getUTCDate()+i);a.push(d);}return a;}
function weekLabel(){var d=weekDates();var a=("0"+d[0].getUTCDate()).slice(-2)+"."+("0"+(d[0].getUTCMonth()+1)).slice(-2),b=("0"+d[4].getUTCDate()).slice(-2)+"."+("0"+(d[4].getUTCMonth()+1)).slice(-2);return weekOffset===0?"Эта неделя":"Следующая неделя";}
function currentWeekKey(){var t=moscow(),n=t.getUTCDay(),m=new Date(t);m.setUTCDate(t.getUTCDate()-(n===0?6:n-1));return m.getUTCFullYear()+"-"+("0"+(m.getUTCMonth()+1)).slice(-2)+"-"+("0"+m.getUTCDate()).slice(-2);}
function loadDoneLocal(){try{doneLocal=JSON.parse(localStorage.getItem("dnevnic_done")||"{}");if(!doneLocal||typeof doneLocal!=="object")doneLocal={};}catch(e){doneLocal={};}}
function normalizeLocal(){
  try{homework=JSON.parse(localStorage.getItem("dnevnic_homework")||"[]");if(!Array.isArray(homework))homework=[];}catch(e){homework=[];}
  for(var i=0;i<homework.length;i++){
    if(!homework[i].day&&homework[i].date){var p=String(homework[i].date).split("-"),d=new Date(+p[0],+p[1]-1,+p[2]||1),n=d.getDay();homework[i].day=n>=1&&n<=5?days[n-1]:"Понедельник";homework[i].week=currentWeekKey();delete homework[i].date;}
    if(!homework[i].week)homework[i].week=currentWeekKey();
  }
}
function save(){try{localStorage.setItem("dnevnic_homework",JSON.stringify(homework));localStorage.setItem("dnevnic_done",JSON.stringify(doneLocal));}catch(e){}}
async function dbLoad(){
  normalizeLocal();
  try{
    if(!window.supabase||!window.supabase.createClient)throw new Error("Supabase library unavailable");
    db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    var r=await db.from("homework").select("*").order("week_key",{ascending:true}).order("day",{ascending:true}).order("id",{ascending:true});
    if(r.error)throw r.error;
    if(!r.data||!r.data.length){
      var old=homework.filter(function(x){return x.task&&x.subject&&x.day&&x.week;}).map(function(x){return {week_key:x.week,day:x.day,subject:x.subject,task:x.task,done:!!x.done};});
      if(old.length){var ins=await db.from("homework").insert(old);if(ins.error)throw ins.error;}
    }
    var r2=await db.from("homework").select("*").order("id",{ascending:true});
    if(r2.error)throw r2.error;
    homework=(r2.data||[]).map(function(x){return {id:x.id,day:x.day,week:x.week_key,subject:x.subject,task:x.task,done:!!doneLocal[x.id]};});
    save();
  }catch(e){console.error("Supabase:",e);save();}
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function linkify(s){
  return s.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<]+)/gi,function(_,before,url){
    var clean=url.replace(/[.,!?;:]+$/,"");
    var href=/^www\./i.test(clean)?"https://"+clean:clean;
    return before+'<a href="'+href+'" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">'+clean+'</a>'+url.slice(clean.length);
  });
}
function startLoading(){var el=document.getElementById("scheduleTitle");if(!el)return;var ws=document.getElementById("weekSwitch");if(ws)ws.classList.add("hidden");var mb=document.getElementById("menu-button");if(mb)mb.classList.add("hidden");loadingDots=0;el.textContent="Загрузка";loadingTimer=setInterval(function(){loadingDots=(loadingDots+1)%4;el.textContent="Загрузка"+Array(loadingDots+1).join(".");},350);} function stopLoading(){if(loadingTimer){clearInterval(loadingTimer);loadingTimer=null;}var ws=document.getElementById("weekSwitch");if(ws)ws.classList.remove("hidden");var mb=document.getElementById("menu-button");if(mb)mb.classList.remove("hidden");}
function renderTabs(){var a=weekDates(),h="";document.getElementById("weekName").textContent=weekLabel();for(var i=0;i<5;i++)h+='<button type="button" class="tab '+(days[i]===selectedDay?"active":"")+'" onclick="selectDay('+i+')"><b>'+shortDays[i]+'</b><span>'+("0"+a[i].getUTCDate()).slice(-2)+"."+("0"+(a[i].getUTCMonth()+1)).slice(-2)+'</span></button>';document.getElementById("dayTabs").innerHTML=h;}
function render(){var l=schedule[selectedDay]||[],h="",wk=weekKey();for(var i=0;i<l.length;i++){h+='<div class="lesson"><div class="num">'+(i+1)+'</div><div class="lesson-info"><div class="lesson-name">'+esc(l[i])+'</div>';for(var j=0;j<homework.length;j++)if(homework[j].week===wk&&homework[j].day===selectedDay&&homework[j].subject===l[i])h+='<div class="lesson-hw '+(homework[j].done?"done":"")+'">ДЗ: '+linkify(esc(homework[j].task))+'</div><div class="actions"><button type="button" onclick="toggleDone('+j+')">'+(homework[j].done?"Вернуть":"Выполнено")+'</button></div>';h+='</div></div>';}document.getElementById("scheduleTitle").textContent=selectedDay;document.getElementById("scheduleList").innerHTML=h;}
function selectDay(i){selectedDay=days[i];renderTabs();render();}
function prevWeek(){if(weekOffset>0){weekOffset--;renderTabs();render();}} function nextWeek(){if(weekOffset<1){weekOffset++;renderTabs();render();}}
function openMenu(){document.getElementById("menuBg").style.display="block";} function closeMenu(){document.getElementById("menuBg").style.display="none";} function setTheme(t){document.body.classList.toggle("light",t==="light");localStorage.setItem("dnevnic_theme",t);document.getElementById("darkThemeBtn").classList.toggle("active",t==="dark");document.getElementById("lightThemeBtn").classList.toggle("active",t==="light");} function telegram(){window.open("https://t.me/Dnevnic_67_bot","_blank","noopener");} function updateSubjectOptions(){var day=document.getElementById("hwDay").value,s=document.getElementById("subject"),l=schedule[day]||[],h="";for(var i=0;i<l.length;i++)h+="<option>"+esc(l[i])+"</option>";s.innerHTML=h;} function openModal(){closeMenu();document.getElementById("menu-button")?.classList.add("hidden");document.getElementById("hwDay").value=selectedDay;document.getElementById("hwWeek").value=String(weekOffset);updateSubjectOptions();var s=document.getElementById("subject"),l=schedule[selectedDay],h="";for(var i=0;i<l.length;i++)h+="<option>"+esc(l[i])+"</option>";s.innerHTML=h;document.getElementById("task").value="";document.getElementById("modalBg").style.display="flex";}
function closeModal(){document.getElementById("modalBg").style.display="none";document.getElementById("menu-button")?.classList.remove("hidden");}
async function addHomework(){
  var s=document.getElementById("subject").value,t=document.getElementById("task").value.trim();
  if(!t){alert("Напиши задание");return;}
  var day=document.getElementById("hwDay").value,w=parseInt(document.getElementById("hwWeek").value,10)||0;
  var btn=document.querySelector(".save");if(btn)btn.disabled=true;
  try{
    var r=await fetch("https://urypxiruqjzbzpvmuawk.supabase.co/functions/v1/dnevnic-bot",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({action:"submit_suggestion",week_offset:w,day:day,subject:s,task:t})
    });
    var data=await r.json();
    if(!r.ok||!data.ok)throw new Error(data.error||"Не удалось отправить заявку");
    closeModal();alert("Заявка отправлена на проверку. После одобрения ДЗ появится в дневнике.");
  }catch(e){console.error(e);alert("Не удалось отправить заявку");}
  finally{if(btn)btn.disabled=false;}
}
async function toggleDone(i){
  if(!homework[i])return;
  homework[i].done=!homework[i].done;
  if(homework[i].done)doneLocal[homework[i].id]=true;else delete doneLocal[homework[i].id];
  save();render();
}
window.selectDay=selectDay;window.prevWeek=prevWeek;window.updateSubjectOptions=updateSubjectOptions;window.openMenu=openMenu;window.closeMenu=closeMenu;window.setTheme=setTheme;window.telegram=telegram;window.nextWeek=nextWeek;window.openModal=openModal;window.closeModal=closeModal;window.addHomework=addHomework;window.toggleDone=toggleDone;
window.addEventListener("DOMContentLoaded",async function(){startLoading();var theme=localStorage.getItem("dnevnic_theme")||"dark";loadDoneLocal();setTheme(theme);var n=moscow().getUTCDay();if(n>=1&&n<=5)selectedDay=days[n-1];normalizeLocal();try{await Promise.race([dbLoad(),new Promise(function(_,reject){setTimeout(function(){reject(new Error("DB timeout"));},7000);})]);}catch(e){console.error("Load:",e);}stopLoading();renderTabs();render();document.getElementById("modalBg").addEventListener("click",function(e){if(e.target===this)closeModal();});document.getElementById("menuBg").addEventListener("click",function(e){if(e.target===this)closeMenu();});});
})();
</script>
</body>
</html>
